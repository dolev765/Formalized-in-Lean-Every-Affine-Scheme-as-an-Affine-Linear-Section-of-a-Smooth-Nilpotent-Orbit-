name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check the main theorem and audit its axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean Universality/MainTheorem.lean | tee verified-statements.txt
      - name: Generate the verified audit page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_audit_page.py
      - name: Publish the verification summary
        shell: bash
        run: |
          {
            echo '## Axioms'
            echo '```text'
            cat verified-statements.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save verification log
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification
          path: verified-statements.txt
      - name: Package the verified GitHub Pages report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish verified theorem report
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified report
        id: deployment
        uses: actions/deploy-pages@v4
