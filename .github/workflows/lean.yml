name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Lint Lean declarations
        shell: bash
        run: |
          lake env lean --stdin <<'LEAN'
          import Universality.MainTheorem
          #lint only unusedArguments defLemma checkType checkUnivs unusedHavesSuffices in Universality
          LEAN
